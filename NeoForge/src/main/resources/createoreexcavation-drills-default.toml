# Create Ore Excavation - Drilling Machine drop tables
#
# Every finished drilling cycle produces exactly ONE drop, picked at random from the table of the
# dimension the machine is in, using the weights of the installed drill's tier.
#
#   weight  - relative weight, NOT a percent. Chance = weight / (sum of all weights of that tier in that dimension).
#             0 or missing = this tier never drops the item.
#   min/max - how many items drop when this entry is picked (random, inclusive). Default 1.
#
# Dimensions without a table can't be drilled in.
# Reload in game with: /coe reload   (requires operator permissions)

# Blocks the machine may stand on. Every block of the 3x3 area, 5 blocks deep below the machine must match.
# Entries starting with '#' are block tags.
drillable_ground = [
	"#minecraft:base_stone_overworld",
	"#minecraft:base_stone_nether",
]

# Drill tiers. The table name is the tier name used for weights below.
#   item   - drill item that has to be inserted into the machine
#   ticks  - length of one cycle at the minimum speed (Create's "medium" speed, 30 RPM by default);
#            faster rotation makes the cycle proportionally shorter
#   stress - stress impact (multiplied by RPM)
[tiers.iron]
item = "createoreexcavation:drill"
ticks = 1200
stress = 256

[tiers.diamond]
item = "createoreexcavation:diamond_drill"
ticks = 800
stress = 512

[tiers.netherite]
item = "createoreexcavation:netherite_drill"
ticks = 600
stress = 1024

# Optional drilling fluid: consumed every cycle, the machine doesn't run without it.
[dimensions."minecraft:overworld"]
fluid = "minecraft:water"
fluid_amount = 250

# Rock makes up most of the output: 75% with the iron drill, 67% with diamond, 60% with netherite.
[dimensions."minecraft:overworld".drops]
"minecraft:cobblestone"            = { min = 2, max = 4, iron = 110, diamond = 76, netherite = 52 }
